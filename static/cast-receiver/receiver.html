
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Poker Tournament TV</title>

  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #101214;
      color: #f4f4f1;
      font-family: Arial, sans-serif;
    }

    .screen {
      min-height: 100vh;
      padding: 3vh 4vw;
      display: flex;
      flex-direction: column;
      gap: 3vh;
      background: radial-gradient(circle at top, rgba(255,255,255,.07), transparent 36rem), #101214;
    }

    header {
      text-align: center;
      color: #c4a36a;
      letter-spacing: .15em;
    }

    h1 {
      text-align: center;
      margin: .3em;
      font-size: 3vw;
    }

    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #181b1f;
      border: 1px solid #343a40;
      border-radius: 24px;
    }

    .game {
      font-size: 2.5vw;
      color: #c4a36a;
      font-weight: bold;
    }

    .timer {
      font-size: 18vw;
      font-weight: bold;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }

    .blinds { font-size: 5vw; }

    .next {
      text-align: center;
      color: #aeb5bb;
      font-size: 2vw;
    }

    .elimination-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.82);
      pointer-events: none;
      opacity: 0;
    }

    .elimination-overlay.show {
      opacity: 1;
      animation: eliminationDisplay 5s ease forwards;
    }

    .elimination-card {
      position: relative;
      z-index: 1;
      padding: 45px 5vw;
      text-align: center;
      transform: scale(0.65);
      animation: eliminationSlam 0.55s cubic-bezier(0.16, 1.35, 0.3, 1) forwards;
    }

    .elimination-top {
      margin-bottom: 12px;
      color: #d9d9d9;
      font-size: clamp(1rem, 2vw, 2rem);
      font-weight: 800;
      letter-spacing: 0.3em;
      animation: eliminationTop 0.4s ease-out 0.15s both;
    }

    .elimination-name {
      max-width: 90vw;
      overflow-wrap: anywhere;
      color: #ffffff;
      font-size: clamp(3rem, 8vw, 7rem);
      font-weight: 950;
      line-height: 0.95;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(255, 40, 40, 0.8), 0 0 30px rgba(255, 0, 0, 0.6), 0 5px 0 #550000;
      animation: eliminationName 0.5s cubic-bezier(0.16, 1.35, 0.3, 1) 0.12s both;
    }

    .elimination-word {
      margin-top: 18px;
      color: #ff3030;
      font-size: clamp(1.8rem, 4vw, 3.5rem);
      font-weight: 950;
      letter-spacing: 0.18em;
      text-shadow: 0 0 8px #ff0000, 0 0 25px rgba(255, 0, 0, 0.8);
      animation: eliminationWord 0.4s ease-out 0.45s both, eliminationPulse 0.75s ease-in-out 0.9s infinite;
    }

    .elimination-impact {
      position: absolute;
      width: 20vw;
      height: 20vw;
      max-width: 350px;
      max-height: 350px;
      border-radius: 50%;
      background: rgba(255, 0, 0, 0.25);
      transform: scale(0);
      animation: eliminationShockwave 0.8s ease-out;
    }

    @keyframes eliminationDisplay {
      0% { opacity: 0; }
      4% { opacity: 1; }
      90% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes eliminationSlam {
      0% { transform: scale(0.65); opacity: 0; }
      55% { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes eliminationTop {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes eliminationName {
      0% { opacity: 0; transform: scale(1.5); }
      65% { opacity: 1; transform: scale(0.96); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes eliminationWord {
      from { opacity: 0; transform: translateY(25px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes eliminationPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
    @keyframes eliminationShockwave {
      0% { transform: scale(0); opacity: 0.8; }
      100% { transform: scale(5); opacity: 0; }
    }
  </style>
</head>

<body>
  <div class="screen">
    <header>LIVE TOURNAMENT</header>
    <h1 id="venue">Connect from the Poker App</h1>

    <main class="hero">
      <div class="game" id="game">WAITING</div>
      <div class="timer" id="timer">--:--</div>
      <div class="blinds" id="blinds">—</div>
    </main>

    <div class="next" id="next"></div>
  </div>

  <div class="elimination-overlay" id="elimination-overlay" aria-hidden="true">
    <div class="elimination-impact"></div>
    <div class="elimination-card">
      <div class="elimination-top">PLAYER ELIMINATED</div>
      <div class="elimination-name" id="elimination-name"></div>
      <div class="elimination-word">ELIMINATED</div>
    </div>
  </div>

  <script>
    (function () {
      const NAMESPACE = 'urn:x-cast:com.miiiike.poker';

      const context = cast.framework.CastReceiverContext.getInstance();

      let venueId = null;
      let remaining = 0;
      let updatedAt = 0;
      let running = false;
      let refreshInterval = null;
      let lastEliminationEventId = null;
      let hasReceivedInitialState = false;
      let eliminationHideTimer = null;

      const el = id => document.getElementById(id);

      function showElimination(event) {
        if (!hasReceivedInitialState) {
          hasReceivedInitialState = true;
          lastEliminationEventId = typeof event?.id === 'string' ? event.id : null;
          return;
        }

        if (!event || typeof event.id !== 'string' || event.id === lastEliminationEventId) return;

        lastEliminationEventId = event.id;
        el('elimination-name').textContent = event.playerName || 'PLAYER';
        const overlay = el('elimination-overlay');

        if (eliminationHideTimer !== null) clearTimeout(eliminationHideTimer);

        overlay.classList.remove('show');
        void overlay.offsetWidth;
        overlay.classList.add('show');

        eliminationHideTimer = setTimeout(() => {
          overlay.classList.remove('show');
          eliminationHideTimer = null;
        }, 5200);
      }

      function draw(d) {
        if (!d) return;

        el('venue').textContent =
          d.venueName || ('Venue ' + venueId);

        el('game').textContent = d.currentGame || 'POKER';
        el('blinds').textContent = d.blinds || '—';

        el('next').textContent =
          'NEXT: ' + (d.nextGame || '—') +
          ' · ' + (d.nextBlinds || '—') +
          ' · PLAYERS: ' + (d.activePlayerCount ?? 0);

        remaining = d.remainingMs || 0;
        updatedAt = d.updatedAt || Date.now();
        running = Boolean(d.running);
        showElimination(d.eliminationEvent);
      }

      async function refresh() {
        if (!venueId) return;

        try {
          const response = await fetch(
            '/api/tournament/' + venueId + '?public=1',
            { cache: 'no-store' }
          );

          if (!response.ok) {
            console.error('Tournament refresh failed:', response.status);
            return;
          }

          const result = await response.json();
          draw(result.state);
        } catch (error) {
          console.error('Tournament refresh error:', error);
        }
      }

      function startPolling() {
        if (refreshInterval !== null) return;

        refresh();
        refreshInterval = setInterval(refresh, 1000);
      }

      function tick() {
        const ms = running
          ? Math.max(0, remaining - (Date.now() - updatedAt))
          : remaining;

        const seconds = Math.ceil(ms / 1000);

        el('timer').textContent =
          String(Math.floor(seconds / 60)).padStart(2, '0') +
          ':' +
          String(seconds % 60).padStart(2, '0');
      }

      context.addCustomMessageListener(
        NAMESPACE,
        event => {
          const incomingVenueId = String(
            event.data?.venueId || ''
          );

          if (!/^\d{1,12}$/.test(incomingVenueId)) {
            console.error('Invalid venue ID received:', incomingVenueId);
            return;
          }

          console.log('Poker receiver connected to venue:', incomingVenueId);

          venueId = incomingVenueId;
          startPolling();
        }
      );

      context.addEventListener(
        cast.framework.system.EventType.READY,
        () => console.log('Poker receiver ready')
      );

      context.addEventListener(
        cast.framework.system.EventType.SHUTDOWN,
        () => console.log('Poker receiver shutting down')
      );

      context.addEventListener(
        cast.framework.system.EventType.ERROR,
        event => console.error('Poker receiver error:', event)
      );

      context.start();

      setInterval(tick, 250);
    })();
  </script>
</body>
</html>
